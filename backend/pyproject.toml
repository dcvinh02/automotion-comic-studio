[project]
name = "automotion-comic-studio-backend"
version = "0.1.0"
description = "Backend engine for AutoMotion Comic Studio (FastAPI, SQLite, FFmpeg, Worker Queue)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*", "core*", "providers*", "schemas*", "database*", "workers*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
